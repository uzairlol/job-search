[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search"
version = "0.1.0"
description = "Modular autonomous job acquisition platform"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "sqlalchemy>=2.0.0"
]

[project.scripts]
job-search = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
